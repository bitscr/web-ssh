name: release

# 手动触发:Actions → release → Run workflow → 输入 tag(如 v0.2.0)
# 产物:GitHub Release + webssh-linux-amd64.tar.gz / webssh-linux-arm64.tar.gz
#       (内含 webssh 二进制 + install.sh)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag,格式 vX.Y.Z(如 v0.2.0)'
        required: true
        type: string
      prerelease:
        description: '标记为 pre-release(测试包,不污染正式版)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: 校验 tag 格式
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须是 vX.Y.Z 格式(如 v0.2.0),收到: $TAG"
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: 依赖缓存
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-${{ hashFiles('go.mod') }}
          restore-keys: go-

      - name: 静态检查
        run: go vet ./...

      - name: 后端测试
        run: go test ./internal/...

      - name: 前端回归
        run: node --test tests/*.test.js

      - name: 构建 (linux/${{ matrix.goarch }})
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w \
            -X main.version=${{ inputs.tag }} \
            -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o webssh .
          file webssh

      - name: 打包 tar.gz
        run: |
          mkdir -p pkg
          cp webssh pkg/webssh
          tar -czf webssh-linux-${{ matrix.arch }}.tar.gz -C pkg webssh
          sha256sum webssh-linux-${{ matrix.arch }}.tar.gz > webssh-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: webssh-linux-${{ matrix.arch }}
          path: |
            webssh-linux-${{ matrix.arch }}.tar.gz
            webssh-linux-${{ matrix.arch }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载两个架构产物
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: 校验 tag 与 Release 一致
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag 必须是 vX.Y.Z(如 v0.2.0),收到: $TAG"
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease=""
          [[ "$PRERELEASE" == "true" ]] && prerelease="--prerelease"
          gh release create "$TAG" \
            dist/webssh-linux-amd64.tar.gz \
            dist/webssh-linux-amd64.tar.gz.sha256 \
            dist/webssh-linux-arm64.tar.gz \
            dist/webssh-linux-arm64.tar.gz.sha256 \
            --title "web-ssh $TAG" \
            $prerelease \
            --generate-notes
          echo "已发布: https://github.com/bitscr/web-ssh/releases/tag/$TAG"